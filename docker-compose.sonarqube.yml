# SonarQube 정적 분석 스택 (옵트인)
# 사용법: make up-sonar     → http://localhost:9000 (초기 admin/admin → 즉시 비밀번호 변경)
#         make scan         → sonar-scanner-cli 로 1회 분석 후 결과를 위 인스턴스로 전송
#         make down-sonar
#
# 평소 개발 시에는 띄우지 않음. 코드 품질 분석이 필요할 때만 옵트인.
# 메모리 ~2GB 필요. 시스템 메모리 부족 시 다른 컨테이너 일부 down 후 사용.

services:
    sonarqube:
        image: sonarqube:10.6-community
        container_name: seoganpyo-sonarqube
        restart: unless-stopped
        depends_on:
            sonar-db:
                condition: service_healthy
        ports:
            - "9000:9000"
        environment:
            - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
            - SONAR_JDBC_USERNAME=${SONAR_DB_USER:-sonar}
            - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD:-sonar}
            # Elasticsearch 가 내부에서 돌아 vm.max_map_count 가 부족하면 기동 실패.
            # 호스트에서 `sysctl -w vm.max_map_count=524288` 또는 wsl 의 경우 자동 처리됨.
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        volumes:
            - sonarqube_data:/opt/sonarqube/data
            - sonarqube_logs:/opt/sonarqube/logs
            - sonarqube_extensions:/opt/sonarqube/extensions
        healthcheck:
            # /api/system/status 응답 본문에 "UP" 이 있어야 정상. wget 가 없는 환경 고려해 curl 우선 사용,
            # SonarQube 10.x community 이미지에는 curl 이 포함됨.
            test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q UP || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 30
            start_period: 180s

    sonar-db:
        image: postgres:15
        container_name: seoganpyo-sonar-db
        restart: unless-stopped
        environment:
            - POSTGRES_USER=${SONAR_DB_USER:-sonar}
            - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD:-sonar}
            - POSTGRES_DB=sonar
        volumes:
            - sonar_db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar}"]
            interval: 5s
            timeout: 3s
            retries: 10

    # sonar-scanner-cli 는 일회성 실행. `make scan` 호출 시 띄웠다가 분석 끝나면 종료.
    # profile 로 묶어둬 `up -d` 에는 안 따라옴.
    # 사용자가 `make up-sonar` 로 미리 인스턴스 띄우고 부팅 완료 확인 후 `make scan` 을 호출하는 흐름이라,
    # depends_on 의 healthcheck 조건은 일부러 생략 — healthcheck 가 잠시 fail 중이어도 9000 응답만 되면 스캔 가능.
    scanner:
        image: sonarsource/sonar-scanner-cli:5.0
        container_name: seoganpyo-sonar-scanner
        profiles: ["scan"]
        environment:
            # 호스트의 .env 는 브라우저용(localhost:9000) 이지만, scanner 컨테이너에서 localhost 는 자기 자신을 가리킴.
            # 같은 compose 네트워크 안의 hostname 으로 강제 — 사용자 .env 값이 잘못 주입되는 사고 방지.
            - SONAR_HOST_URL=http://sonarqube:9000
            - SONAR_TOKEN=${SONAR_TOKEN:-}
            # scanner JVM 메모리 확장 — 기본 512m 으로는 100+ TS 파일 분석 시 bridge server 가 OOM/hang.
            - SONAR_SCANNER_OPTS=-Xmx2g
            # JS/TS bridge server (내부 Node.js) 응답 대기 타임아웃 (초). 기본 5분 → 무거운 파일 위해 10분.
            - SONAR_JAVASCRIPT_BRIDGE_SERVER_TIMEOUT=600
        volumes:
            - .:/usr/src
        working_dir: /usr/src

volumes:
    sonarqube_data:
    sonarqube_logs:
    sonarqube_extensions:
    sonar_db_data:
