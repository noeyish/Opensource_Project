# SonarQube 정적 분석 설정 (self-hosted).
#
# sonar.host.url / sonar.token 은 환경변수(SONAR_HOST_URL, SONAR_TOKEN) 로 주입.
# 로컬: make scan (또는 docker compose --profile scan run --rm scanner)
# CI : .github/workflows/ci.yml 의 sonar-scan job 이 자동 실행.

sonar.projectKey=seoganpyo
sonar.projectName=서간표
sonar.projectVersion=1.0

# 소스/테스트 경로
sonar.sources=app,frontend/src
sonar.tests=tests

# 분석 제외 — 빌드 산출물·외부 의존·자동 생성·일회성 스크립트
sonar.exclusions=\
    **/node_modules/**,\
    **/.next/**,\
    **/__pycache__/**,\
    **/static/uploads/**,\
    **/data/**,\
    frontend/e2e/**,\
    infra/loadtest/**,\
    scripts/**,\
    .venv*/**,\
    venv*/**,\
    **/migrations/**

# 커버리지 산정 제외 — 외부 API 호출 위주라 단위 테스트가 사실상 불가능한 파일.
# 정확도가 의미 없는 영역을 빼면 New Code Coverage 가 왜곡되지 않음.
sonar.coverage.exclusions=\
    app/services/image_service.py,\
    app/services/crawl_service.py,\
    app/services/syllabus_service.py,\
    app/services/email_service.py,\
    app/services/ai_service.py,\
    app/services/admin_security_assistant.py,\
    ocr-service/**

# Python
sonar.python.version=3.11
sonar.python.coverage.reportPaths=reports/coverage.xml

# TypeScript / JavaScript (Next.js)
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# 소스 인코딩
sonar.sourceEncoding=UTF-8
