# SonarCloud 정적 분석 설정.
#
# sonar.organization / sonar.projectKey 는 sonarcloud.io 가입 후 "Import GitHub Repository"
# 시점에 발급된 값으로 채워야 함. 보통 다음 형식:
#   organization = <github-org-key>           (예: gibunijjaejo)
#   projectKey   = <github-org-key>_<repo>    (예: gibunijjaejo_Opensource_Project)
# SonarCloud 의 Project Settings 화면 상단에서 확인 가능.
#
# 분석은 GitHub Actions(.github/workflows/sonarcloud.yml) 가 PR/push 마다 자동 실행.

sonar.organization=gibunijjaejo
sonar.projectKey=gibunijjaejo_Opensource_Project
sonar.projectName=서간표
sonar.projectVersion=1.0

# 소스/테스트 경로
sonar.sources=app,frontend/src
sonar.tests=tests

# 분석 제외 — 빌드 산출물·외부 의존·자동 생성·일회성 스크립트
sonar.exclusions=\
    **/node_modules/**,\
    **/.next/**,\
    **/__pycache__/**,\
    **/static/uploads/**,\
    **/data/**,\
    frontend/e2e/**,\
    infra/loadtest/**,\
    scripts/**,\
    .venv*/**,\
    venv*/**,\
    **/migrations/**

# 커버리지 산정 제외 — 외부 API 호출 위주라 단위 테스트가 사실상 불가능한 파일,
# 또는 CI 에서 테스트 러너를 돌리지 않는 영역(프론트엔드).
# 정확도가 의미 없는 영역을 빼면 New Code Coverage 가 왜곡되지 않음.
sonar.coverage.exclusions=\
    app/services/image_service.py,\
    app/services/crawl_service.py,\
    app/services/syllabus_service.py,\
    app/services/email_service.py,\
    app/services/ai_service.py,\
    app/services/admin_assistant.py,\
    app/services/admin_security_assistant.py,\
    app/services/discord_service.py,\
    app/services/portfolio_migration.py,\
    app/services/special_courses_service.py,\
    app/api/admin_security.py,\
    app/api/admin_security_chat.py,\
    frontend/**,\
    ocr-service/**

# Python
sonar.python.version=3.11
sonar.python.coverage.reportPaths=reports/coverage.xml

# TypeScript / JavaScript (Next.js)
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# 소스 인코딩
sonar.sourceEncoding=UTF-8
